services:
  - type: web
    name: evaluation-system-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: QWEN_API_KEY
        sync: false
      - key: ZHIPU_API_KEY
        sync: false
      - key: MOONSHOT_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://*.vercel.app
